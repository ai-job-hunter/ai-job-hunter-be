plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.aijobhunter'
version = '0.2.0'

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.ai:spring-ai-bom:2.0.1'
    }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Database
    runtimeOnly 'org.postgresql:postgresql'
    
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
    
    // Utilities
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // JSON
    // Spring Boot 4.x 默认引入 tools.jackson.core:jackson-databind:3.x（Jackson 3）
    // ObjectMapper 类型为 tools.jackson.databind.ObjectMapper，由 Spring Boot 自动配置
    // 不要显式声明 com.fasterxml.jackson.core:jackson-databind，会覆盖 Boot 4 的 Jackson 3 依赖
    
    // Spring AI (Agent 支持) - DeepSeek 接入
    implementation 'org.springframework.ai:spring-ai-starter-model-deepseek'
    
    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Testcontainers（真实 PostgreSQL + Redis，与生产环境完全等价）
    // 整体升到 2.0.5 + 新坐标（org.testcontainers:testcontainers-*）；
    // 此前混用 testcontainers:2.0.5 + 子模块 1.20.4 会触发 shaded jar 缺失
    // （org.testcontainers.shaded.org.apache.commons.io.IOUtils 找不到）。
    // ref: https://github.com/testcontainers/testcontainers-java/issues/11481
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-mysql'  // 若未来引入 MySQL 场景

    // 注意：不再需要 H2 和 embedded-redis，改为 Testcontainers 跑真实 PostgreSQL
}

tasks.named('test') {
    useJUnitPlatform()
}
