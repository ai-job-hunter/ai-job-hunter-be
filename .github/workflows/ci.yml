# =============================================================================
# AI Job Hunter Backend - CI Workflow
#
# 关键原则：
#   - compile 失败必须阻断 CD（避免 Spring 启动时才发现 Bean 注入错误）
#   - 单元测试 0 个时，./gradlew test 静默成功，必须强制校验编译+Bean装配
#   - 任务拆分：compile (编译校验) → test (单元测试) → smoke (Testcontainers 冒烟)
#   - smoke 用 Testcontainers 跑真实 PostgreSQL + Redis，与生产环境完全等价
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 任务 1：编译校验
  # 目的：兜底"代码根本编译不过"的情况（bean 注入错误、缺依赖、语法错误）
  # 即使后续 test/smoke 失败或被跳过，也能拦住编译错误
  # ─────────────────────────────────────────────────────────────────────
  compile:
    name: Compile Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile main + test sources
        run: ./gradlew assemble --no-daemon

      - name: Upload compile artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: compile-output
          path: build/libs/*.jar

  # ─────────────────────────────────────────────────────────────────────
  # 任务 2：单元测试
  # 目的：跑 JUnit 测试（不含 Spring 上下文）
  # 依赖 compile，避免测试代码本身编译失败被忽略
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon --info

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/

  # ─────────────────────────────────────────────────────────────────────
  # 任务 3：Spring 上下文冒烟测试（Testcontainers）
  # 目的：强制启动 Spring 上下文，校验所有 @Service / @Configuration
  #       的 Bean 都能成功注入。
  #
  # 环境：Testcontainers 启动真实 PostgreSQL 18 + Redis 7 容器，
  #       与生产 docker-compose.yml 完全等价。
  #
  # 依赖 compile，确保编译通过后再跑冒烟。
  # ─────────────────────────────────────────────────────────────────────
  smoke:
    name: Spring Context Smoke Test
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker is available
        run: docker --version

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-smoke-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Pre-pull Docker images for Testcontainers
        run: |
          docker pull postgres:18-alpine || true
          docker pull redis:7-alpine || true

      - name: Run Spring context smoke test
        run: ./gradlew test --no-daemon --tests ContextLoadsTest --info

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: build/reports/tests/test/
