# AI Job Hunter Backend - CD Workflow

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_PROJECT: ai-job-hunter-be
  COMPOSE_FILE: docker-compose.yml
  COMPOSE_SERVICES: ai-job-hunter-be
  DEPLOY_PRIMARY_BRANCH: ${{ vars.DEPLOY_PRIMARY_BRANCH || 'main' }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  # ── Step 1: Build & Push Docker image to GHCR ──────────────────────────────
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_PROJECT }}:${{ github.run_id }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_PROJECT }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get commit info
        id: commit
        run: |
          COMMIT_MSG=$(gh api repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }} --jq '.commit.message' 2>/dev/null | head -1)
          echo "message=${COMMIT_MSG}" >> "$GITHUB_OUTPUT"
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## 🚀 Deploy: ${{ env.IMAGE_PROJECT }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ steps.commit.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Message**: ${{ steps.commit.outputs.message }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: CI workflow on \`${{ github.event.workflow_run.head_branch }}\`" >> $GITHUB_STEP_SUMMARY

  # ── Step 2: Deploy to server (only on main branch + CI passed) ─────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Set workflow run name from git commit
        run: |
          set +e
          COMMIT_MSG=$(gh api repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }} --jq '.commit.message' 2>/dev/null | head -1)
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="${{ github.event.workflow_run.head_sha }}"
          fi
          gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }} \
            -X PATCH \
            -f name="🚀 ${COMMIT_MSG%\\n*}" || true

      - name: Check CI status
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "CI did not succeed, skipping deployment"
          exit 78

      - name: Check deploy branch
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" != "${{ env.DEPLOY_PRIMARY_BRANCH }}" ]; then
            echo "Not primary branch (${{ github.event.workflow_run.head_branch }}), skipping"
            exit 78
          fi

      - name: Validate SSH key
        run: |
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh-keygen -l -f ~/ssh_key
          echo "SSH key validated"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_NAMESPACE,DEPLOY_PATH,COMPOSE_FILE,COMPOSE_SERVICES
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            echo "=== Login to GHCR ==="
            echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== Update docker-tag.env ==="
            {
              echo "IMAGE_TAG=${IMAGE_TAG}"
              echo "IMAGE_NAMESPACE=${IMAGE_NAMESPACE}"
              grep -v '^IMAGE_TAG=\|^IMAGE_NAMESPACE=' docker-tag.env 2>/dev/null || true
            } | tee docker-tag.env > /dev/null

            echo "=== Pull and restart (tag: $IMAGE_TAG) ==="
            docker compose -f ${{ env.COMPOSE_FILE }} pull ${{ env.COMPOSE_SERVICES }}
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --no-deps ${{ env.COMPOSE_SERVICES }}

            echo "=== Done ==="
            docker compose ps

      - name: Cleanup
        run: rm -f ~/ssh_key
