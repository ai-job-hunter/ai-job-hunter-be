# AI Job Hunter Backend - CD Workflow

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

env:
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_PROJECT: ai-job-hunter-be
  COMPOSE_FILE: docker-compose.yml
  COMPOSE_SERVICES: ai-job-hunter-be
  DEPLOY_PRIMARY_BRANCH: ${{ vars.DEPLOY_PRIMARY_BRANCH || 'main' }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check CI status
        if: ${{ github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "CI did not succeed, skipping deployment"
          exit 78

      - name: Check deploy branch
        run: |
          if [ "${{ github.event.workflow_run.head_branch }}" != "${{ env.DEPLOY_PRIMARY_BRANCH }}" ]; then
            echo "Not primary branch (${{ github.event.workflow_run.head_branch }}), skipping"
            exit 78
          fi

      - name: Prepare image tag
        id: image_tag
        run: |
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Validate SSH key
        run: |
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/ssh_key
          chmod 600 ~/ssh_key
          ssh-keygen -l -f ~/ssh_key
          echo "SSH key validated"

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_NAMESPACE,DEPLOY_PATH
          script: |
            set -e
            cd ${{ env.DEPLOY_PATH }}

            echo "=== Login to GHCR ==="
            echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            {
              echo "IMAGE_TAG=$IMAGE_TAG"
              echo "IMAGE_NAMESPACE=$IMAGE_NAMESPACE"
              grep -v '^IMAGE_TAG=\|^IMAGE_NAMESPACE=' docker-tag.env
            } > docker-tag.env.tmp && mv docker-tag.env.tmp docker-tag.env

            echo "=== Pull and restart ==="
            docker compose pull
            docker compose up -d

            echo "=== Done ==="
            docker compose ps

      - name: Cleanup
        run: rm -f ~/ssh_key
