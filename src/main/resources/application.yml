server:
  port: 8080

spring:
  application:
    name: ai-job-hunter
  
  datasource:
    url: jdbc:postgresql://${PGSQL_HOST:localhost}:${PGSQL_PORT:5432}/${PGSQL_DB:job_hunter}?sslmode=${PGSQL_SSLMODE:disable}
    username: ${PGSQL_USERNAME:postgres}
    password: ${PGSQL_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: app
        # JPA 自动建表时物理命名策略（驼峰转下划线，与 PostgreSQL 默认一致）
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  # Flyway：build.gradle 暂未引入 flyway-core，配置先注释。
  # 后续若引入 Flyway，把下面注释打开，并建 src/main/resources/db/migration/V1__init.sql
  # flyway:
  #   enabled: true
  #   baseline-on-migrate: true
  #   schemas: app
  #   default-schema: app
  #   table: flyway_schema_history
  #   locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}

  # Spring AI: OpenAI ChatClient（由 spring-ai-starter-model-openai 自动装配 ChatClient.Builder）
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_MODEL:gpt-4o}
          temperature: ${SPRING_AI_OPENAI_CHAT_TEMPERATURE:0.7}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-must-be-at-least-32-chars}
  expiration: 86400000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: true
    db:
      enabled: true

# File Storage
app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  cookie:
    storage: local

# Logging
logging:
  level:
    root: INFO
    com.aijobhunter: DEBUG
