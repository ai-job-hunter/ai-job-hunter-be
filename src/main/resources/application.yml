server:
  port: 8080

spring:
  application:
    name: ai-job-hunter
  
  datasource:
    url: jdbc:postgresql://localhost:5432/aijobhunter
    username: postgres
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
      database: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-must-be-at-least-32-chars}
  expiration: 86400000

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: true
    db:
      enabled: true

# File Storage
app:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  cookie:
    storage: local

# Logging
logging:
  level:
    root: INFO
    com.aijobhunter: DEBUG
